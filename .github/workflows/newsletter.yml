name: IT Newsletter

# 자동 스케줄 실행 없음 — 실제 정기 발송은 별도 프라이빗 리포에서 담당.
# 여기서는 workflow_dispatch 수동 실행만(검증·재발송용), 중복 실행 방지.
on:
  workflow_dispatch:
    inputs:
      date:
        description: "특정 날짜 재발송 (YYYYMMDD, 비우면 오늘 자동 모드)"
        required: false
        default: ""
      no_send:
        description: "발송 없이 본문 생성만 (검증용)"
        type: boolean
        required: false
        default: false
      force:
        description: "dedup 우회하고 실발송 (클라우드 발송 검증용)"
        type: boolean
        required: false
        default: false
      internal_only:
        description: "외부 수신자 제외, 내부 수신자에게만 발송 (테스트용)"
        type: boolean
        required: false
        default: false

concurrency:
  group: newsletter
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TZ: Asia/Seoul
      GMAIL_TOKEN_JSON: ${{ secrets.GMAIL_TOKEN_JSON }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
      RECIPIENTS: ${{ secrets.RECIPIENTS }}
      NEWSLETTER_EXTERNAL_TO: ${{ secrets.NEWSLETTER_EXTERNAL_TO }}
      NEWSLETTER_EXTERNAL_ONCE: ${{ secrets.NEWSLETTER_EXTERNAL_ONCE }}
      NEWSLETTER_GREETING: ${{ vars.NEWSLETTER_GREETING }}
      NEWSLETTER_OUT: ${{ github.workspace }}/out
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: npm install -g @anthropic-ai/claude-code

      - name: Run newsletter
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.date }}" ]; then
            ARGS="${{ github.event.inputs.date }}"
          fi
          if [ "${{ github.event.inputs.no_send }}" = "true" ]; then
            ARGS="$ARGS --no-send"
          fi
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            ARGS="$ARGS --force"
          fi
          # 테스트 시 외부 수신자 제외 → 내부 수신자에게만 실발송
          if [ "${{ github.event.inputs.internal_only }}" = "true" ]; then
            export NEWSLETTER_EXTERNAL_TO=""
          fi
          python oneshot.py $ARGS

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newsletter-output
          path: |
            out/*.md
            LAST_STATUS.txt
          if-no-files-found: ignore
          retention-days: 14
